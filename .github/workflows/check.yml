name: OficinIA - verificacao do codigo
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/oficinia-v06-financeiro, feature/oficinia-v07-integridade, feature/oficinia-v08-cobranca-assistida, feature/oficinia-v09-independente]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Build with independent environment, without Lovable Cloud variables
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
        run: bun run build
      - name: TypeScript strict typecheck
        run: bunx tsc --noEmit
      - name: ESLint completo dos arquivos alterados
        run: |
          bunx eslint src/routes/financeiro.tsx 'src/routes/ordem.$id.tsx' src/lib/oficina-store.ts
      - name: Lint completo - zero erros e avisos
        run: bunx eslint . --max-warnings 0
      - name: Smoke test standalone Node server and SSR
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
        run: bash scripts/smoke-runtime.sh
      - name: Protect independent environment files
        run: |
          test -z "$(git ls-files .env)"
          ! grep -R -E 'VITE_.*(SERVICE_ROLE|SECRET_KEY)' .env.example



  container:
    if: github.ref == 'refs/heads/feature/oficinia-v09-independente'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build independent production container
        run: |
          docker build -t oficinia-independent-ci \
            --build-arg VITE_SUPABASE_URL=https://example.supabase.co \
            --build-arg VITE_SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_placeholder .
      - name: Start production container with dummy configuration
        run: |
          docker run -d --name oficinia-independent-ci -p 127.0.0.1:4180:3000 \
            -e SUPABASE_URL=https://example.supabase.co \
            -e SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_placeholder \
            oficinia-independent-ci
          ready=0
          for i in $(seq 1 45); do
            if curl --silent --show-error --fail http://127.0.0.1:4180/ -o /tmp/oficinia-container-home 2>/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then docker logs oficinia-independent-ci; exit 1; fi
          grep -q 'OficinIA' /tmp/oficinia-container-home
          curl --silent --show-error --fail http://127.0.0.1:4180/login -o /dev/null
          echo INDEPENDENT_DOCKER_DEPLOY_SMOKE_PASSED
      - name: Stop isolated container
        if: always()
        run: docker rm -f oficinia-independent-ci || true

  database:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oficinia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d oficinia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: oficinia_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Apply schema and migration in disposable database
        run: |
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260927193602_fd1d9671-18d6-440f-a56d-3b5e9af0b8db.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/legacy.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260927230000_oficinia_integridade.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260927233000_cobranca_assistida.sql
      - name: Verify numbering, permissions, RLS and payment rules
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/phase2.sql
      - name: Verify assisted charges and explicit confirmation
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/assisted-charges.sql
      - name: Verify two concurrent payments
        run: bash supabase/tests/concurrency.sh
      - name: Verify concurrent assisted charge reservations
        run: bash supabase/tests/charge-concurrency.sh
