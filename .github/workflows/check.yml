name: OficinIA - verificacao do codigo
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/oficinia-v06-financeiro]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run lint
