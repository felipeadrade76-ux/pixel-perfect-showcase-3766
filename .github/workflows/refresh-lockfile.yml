name: OficinIA - atualizar lockfile (temporario)
on:
  workflow_dispatch:
jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/oficinia-fases-1-3
      - uses: oven-sh/setup-bun@v2
      - name: Regenerate lockfile without changing application code
        run: bun install
      - name: Commit updated dependency graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync Bun lockfile after independent build migration"
            git push origin HEAD:audit/oficinia-fases-1-3
          fi
