# Optional staging blueprint. Import deliberately through the owner's Render account.
# This file does not deploy anything by itself.
services:
  - type: web
    name: ritmeia-homologacao
    runtime: docker
    branch: feature/ritmeia-v12-integracoes
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: NFSE_PROVIDER
        value: disabled
      - key: NFSE_AMBIENTE
        value: homologacao
